name: vodkania_game
description: A 2D top-down action/survival crowd game set in Vodkania
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flame: ^1.18.0
  flame_audio: ^2.1.0
  flame_tiled: ^3.0.11
  flutter:
    sdk: flutter
  vector_math: ^2.1.4
  # ...existing dependencies...

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.0.17
  test: ^1.25.0
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/tiles/
    - assets/tiles/CityObjects.tsx
    - assets/images/
    - assets/images/city/
    - assets/images/city/Tilemap/
    - assets/images/city/Tiles/
    - assets/images/player/
    - assets/images/tiles/
    - assets/images/buildings/
    - assets/images/vehicles/
    - assets/images/placeholders/
    - assets/images/generated_sprite_pack/characters/
    - assets/images/generated_sprite_pack/objects/
    - assets/audio/
